<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Probaktronic</title>

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link href="css/global.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }
    .auth-card-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      z-index: 10;
    }
    .auth-card {
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 36px 28px;
    }
    .auth-brand-logo {
      max-height: 54px;
      max-width: 100%;
      width: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }
    .auth-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      color: #0F172A;
      letter-spacing: 0.5px;
    }
    .auth-subtitle {
      font-size: 0.88rem;
      color: #64748B;
    }
    .form-control:focus {
      border-color: #D32F2F;
      box-shadow: 0 0 0 0.25rem rgba(211, 47, 47, 0.15);
    }
    .btn-auth-submit {
      background-color: #D32F2F;
      border-color: #D32F2F;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .btn-auth-submit:hover {
      background-color: #B71C1C;
      border-color: #B71C1C;
      color: white;
      transform: translateY(-1px);
    }
    .input-group-text-custom {
      background-color: #F8FAFC;
      border-right: none;
      color: #64748B;
    }
    .input-with-icon {
      border-left: none;
    }
  </style>
</head>
<body>

  <!-- Tech Circuit Vector Background Watermark -->
  <svg class="bg-circuit-watermark" viewBox="0 0 800 600" fill="none">
    <path d="M 300 0 L 450 150 L 700 150 L 800 250" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="450" cy="150" r="4" fill="#94A3B8"/>
    <circle cx="700" cy="150" r="4" fill="#94A3B8"/>
    <path d="M 500 0 L 600 100 L 800 100" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="600" cy="100" r="3" fill="#CBD5E1"/>
  </svg>

  <div class="auth-card-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <a href="index.html" class="d-inline-block w-100 text-center" title="Probaktronic Home">
          <img src="logo_probaktronic_costado.png" alt="Probaktronic Logo" class="auth-brand-logo mb-3">
        </a>
        <h3 class="auth-title text-uppercase mb-1">INICIAR SESIÓN</h3>
        <p class="auth-subtitle mb-0">Acceda al sistema de diagnóstico automotriz</p>
      </div>

      <!-- Alert Notification Area -->
      <div id="authAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="authAlertText">Mensaje de error</span>
      </div>

      <!-- Login Form -->
      <form id="loginAuthForm" novalidate>
        <!-- Email or Username Input -->
        <div class="mb-3">
          <label for="emailInput" class="form-label text-dark fw-semibold small">CORREO ELECTRÓNICO / USUARIO</label>
          <div class="input-group">
            <span class="input-group-text input-group-text-custom"><i class="bi bi-envelope-fill"></i></span>
            <input type="text" class="form-control input-with-icon" id="emailInput" placeholder="ingrese su correo" required autocomplete="username">
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label for="passwordInput" class="form-label text-dark fw-semibold small">CONTRASEÑA</label>
          </div>
          <div class="input-group">
            <span class="input-group-text input-group-text-custom"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control input-with-icon" id="passwordInput" placeholder="ingrese su contraseña" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Mostrar/Ocultar contraseña">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-auth-submit w-100 d-flex align-items-center justify-content-center gap-2 mb-3" id="btnLoginSubmit">
          <span id="btnSubmitText">INGRESAR AL SISTEMA</span>
          <div class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </button>
      </form>

      <!-- Bottom Links -->
      <div class="text-center pt-3 border-top">
        <p class="small text-muted mb-2">
          ¿No tienes una cuenta activada? 
          <a href="registro.html" class="text-danger fw-bold text-decoration-none">Regístrate aquí</a>
        </p>
        <a href="index.html" class="small text-secondary text-decoration-none d-inline-flex align-items-center gap-1">
          <i class="bi bi-arrow-left"></i> Volver a la página principal
        </a>
      </div>

    </div>
  </div>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Bootstrap & Auth JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/global.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginAuthForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const alertEl = document.getElementById('authAlert');
      const alertText = document.getElementById('authAlertText');
      const btnSubmit = document.getElementById('btnLoginSubmit');
      const btnSubmitText = document.getElementById('btnSubmitText');
      const spinner = document.getElementById('loginSpinner');

      // Toggle Password Visibility
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePasswordBtn.querySelector('i').className = type === 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill';
      });

      // Handle Login Form Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertEl.classList.add('d-none');

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showError('Por favor complete todos los campos.');
          return;
        }

        // Show Spinner
        btnSubmit.disabled = true;
        btnSubmitText.textContent = 'AUTENTICANDO...';
        spinner.classList.remove('d-none');

        try {
          await window.loginUser(email, password);
          if (typeof showGlobalToast === 'function') {
            showGlobalToast('¡Inicio de sesión exitoso!');
          }
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } catch (err) {
          console.error('Error al iniciar sesión:', err);
          let msg = err.message || 'Error al iniciar sesión.';
          if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            msg = 'La contraseña o correo/usuario ingresado es incorrecto.';
          } else if (err.code === 'auth/user-not-found') {
            msg = 'No existe una cuenta registrada con este correo o usuario.';
          } else if (err.code === 'auth/invalid-email') {
            msg = 'El formato del correo electrónico es inválido.';
          }
          showError(msg);
        } finally {
          btnSubmit.disabled = false;
          btnSubmitText.textContent = 'INGRESAR AL SISTEMA';
          spinner.classList.add('d-none');
        }
      });

      function showError(text) {
        alertText.textContent = text;
        alertEl.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
